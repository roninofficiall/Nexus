name: Nexus

options:
  deploymentTarget:
    iOS: "17.0"

targets:
  Nexus:
    type: application
    platform: iOS

    sources:
      - path: Nexus

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ronin.Nexus
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO